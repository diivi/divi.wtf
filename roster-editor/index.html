<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cricket Coach — Roster Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%8F%8F%3C/text%3E%3C/svg%3E" />
<meta name="description" content="Edit the Cricket Coach player pool in a spreadsheet, then export your roster." />
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel2: #1c232d;
    --line: #2a313c;
    --text: #e6edf3;
    --muted: #8b97a7;
    --accent: #4f9dff;
    --good: #2ea043;
    --warn: #d29922;
    --bad: #f85149;
    --chip: #222a35;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .grow { flex: 1; }
  button, .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
    font-weight: 550; white-space: nowrap;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04101f; }
  button.danger { color: var(--bad); }
  button.toggle.on { background: var(--accent); border-color: var(--accent); color: #04101f; }
  button:disabled { opacity: .45; cursor: default; }
  input, select { font: inherit; color: var(--text); }
  .hsel {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; font-size: 12.5px; font-weight: 550; cursor: pointer;
  }
  .hsel:hover { border-color: var(--accent); }
  /* crest thumbnails (custom logo) */
  .crest { width: 20px; height: 20px; object-fit: contain; flex: none; }
  .crest-lg { width: 56px; height: 56px; object-fit: contain; background: #0c1016; border-radius: 8px; padding: 4px; }
  .logo-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 10px; }
  .logo-row .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .logo-slot { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
    background: #0c1016; border: 1px dashed var(--line); border-radius: 8px; color: #5c6675; font-size: 10px; text-align: center; }
  .toolbar2 {
    padding: 8px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel);
  }
  .search {
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 10px; min-width: 200px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px;
  }
  .chip.active { background: var(--accent); color: #04101f; border-color: var(--accent); }
  .chip .ct { opacity: .7; font-variant-numeric: tabular-nums; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
  .chip .dot.err { background: var(--bad); }
  .chip .dot.warn { background: var(--warn); }
  .wrap { flex: 1; overflow: auto; position: relative; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; }
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; }
  thead th {
    position: sticky; top: 0; z-index: 3; background: var(--panel2);
    vertical-align: top; white-space: nowrap;
  }
  thead th .hlabel {
    padding: 7px 8px 6px; font-size: 11px; color: var(--muted); text-align: center;
    font-weight: 600; letter-spacing: .3px; cursor: pointer; user-select: none;
  }
  thead th .hlabel.nosort { cursor: default; }
  thead th .hlabel:hover:not(.nosort) { color: var(--text); }
  thead th .hlabel .full { display: block; font-size: 9px; color: #5c6675; font-weight: 400; }
  thead th .hlabel .arrow { color: var(--accent); font-size: 10px; }
  thead th .hfilter { padding: 0 4px 5px; }
  thead th .hfilter input, thead th .hfilter select {
    width: 100%; min-width: 52px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 4px; font-size: 11px; text-align: center;
  }
  thead.nofilter th .hfilter { display: none; }
  tbody td { background: var(--panel); height: 30px; }
  tbody tr:hover td { background: #1a212b; }
  td input, td select {
    background: transparent; border: 0; width: 100%; height: 30px; padding: 0 7px;
    outline: none; text-align: center;
  }
  td.txt input { text-align: left; }
  td input:focus, td select:focus { background: #0c1722; box-shadow: inset 0 0 0 1.5px var(--accent); }
  td.num input { font-variant-numeric: tabular-nums; }
  td select { cursor: pointer; appearance: none; -webkit-appearance: none; }
  .sticky1 { position: sticky; left: 0; z-index: 2; }
  .sticky2 { position: sticky; z-index: 2; }
  thead .sticky1, thead .sticky2 { z-index: 4; }
  td.sticky1, td.sticky2 { background: var(--panel2); border-right: 1px solid var(--line); }
  tbody tr:hover td.sticky1, tbody tr:hover td.sticky2 { background: #232c38; }
  .rowtools { display: flex; gap: 2px; justify-content: center; }
  .rowtools button { padding: 2px 6px; font-size: 11px; border-radius: 5px; }
  .tagcell { padding: 0 6px; cursor: pointer; min-height: 30px; display: flex; align-items: center; flex-wrap: wrap; gap: 3px; justify-content: center; }
  .tag { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 10.5px; }
  .tag.empty { color: #5c6675; }
  .valbar {
    padding: 7px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .valbar .badge { padding: 3px 9px; border-radius: 6px; font-weight: 650; font-size: 12px; }
  .valbar .badge.ok { background: rgba(46,160,67,.18); color: #56d364; }
  .valbar .badge.err { background: rgba(248,81,73,.16); color: #ff7b72; }
  .valbar .badge.warn { background: rgba(210,153,34,.16); color: #e3b341; }
  .vallist { max-height: 30vh; overflow: auto; border-bottom: 1px solid var(--line); background: var(--bg); }
  .vallist .v { padding: 6px 16px; border-bottom: 1px solid #1a2029; font-size: 12px; cursor: pointer; }
  .vallist .v:hover { background: var(--panel); }
  .vallist .v .sev { font-weight: 700; margin-right: 8px; }
  .vallist .v.err .sev { color: var(--bad); }
  .vallist .v.warn .sev { color: var(--warn); }
  .hidden { display: none !important; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: center; justify-content: center; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(640px, 94vw); max-height: 88vh; overflow: auto; }
  .modal.wide { width: min(820px, 96vw); }
  .modal h2 { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 14px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .modal .body { padding: 14px 18px; }
  .modal .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .modal .row label { width: 150px; color: var(--muted); font-size: 12px; }
  .modal .row input, .modal .row select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; flex: 1; }
  .modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--panel); }
  .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .checklist label { display: flex; align-items: center; gap: 7px; width: auto; color: var(--text); font-size: 12.5px; padding: 3px 0; cursor: pointer; }
  .checklist input { flex: none; width: auto; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty-state .big { font-size: 16px; color: var(--text); margin-bottom: 8px; }
  .note { color: var(--muted); font-size: 11.5px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); color: var(--text); padding: 10px 18px; border-radius: 8px; z-index: 80; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  /* diff */
  .diff-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .diff-stat { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .diff-stat b { font-size: 18px; display: block; }
  .diff-stat span { font-size: 11px; color: var(--muted); }
  .diff-sec { margin-bottom: 16px; }
  .diff-sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .diff-player { border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; margin-bottom: 7px; background: var(--bg); }
  .diff-player .ph { font-weight: 650; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .diff-player .ph .where { font-size: 11px; color: var(--muted); font-weight: 400; }
  .diff-player .badge-add { color: #56d364; font-size: 11px; font-weight: 700; }
  .diff-player .badge-del { color: #ff7b72; font-size: 11px; font-weight: 700; }
  .diff-field { font-size: 12px; margin: 2px 0; }
  .diff-field .fk { color: var(--muted); display: inline-block; min-width: 92px; }
  .old { color: #ff7b72; }
  .arrowc { color: var(--muted); margin: 0 5px; }
  .new { color: #56d364; }
  .diff-none { color: var(--muted); padding: 30px; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Cricket Coach Roster Editor <small>edit teams &amp; players, export your version</small></h1>
  <span class="grow"></span>
  <select id="rosterSource" class="hsel" title="Load a bundled roster">
    <option value="default_roster.json">Default Roster — Premier T20</option>
    <option value="community_roster.json">Community Roster</option>
    <option value="roster_stock_all.json">Stock — all leagues</option>
  </select>
  <select id="leagueSwitch" class="hsel hidden" title="League to edit"></select>
  <input id="contributor" class="search" style="min-width:150px" placeholder="Your name (optional)" />
  <button id="btnDiff">Diff vs default</button>
  <button id="btnImport">Import roster…</button>
  <button id="btnExport" class="primary">Export roster</button>
  <input id="fileInput" type="file" accept=".json,application/json" class="hidden" />
</header>

<div id="valbar" class="valbar">
  <span id="valBadge" class="badge ok">Roster OK</span>
  <span id="valSummary" class="note">No problems found.</span>
  <span class="grow"></span>
  <span class="note">click to view issues ▾</span>
</div>
<div id="vallist" class="vallist hidden"></div>

<div class="toolbar2">
  <input id="search" class="search" placeholder="Search player name…" />
  <div id="chips" class="chips"></div>
  <span class="grow"></span>
  <button id="btnFilters" class="toggle">Column filters</button>
  <button id="btnClear" class="hidden">Clear sort/filters</button>
  <button id="btnAdd">+ Add player</button>
</div>

<div class="wrap" id="wrap">
  <div id="emptyState" class="empty-state">
    <div class="big">Loading default roster…</div>
    <div class="note">If nothing appears, click “Load default”, or “Import roster…” to open a file someone shared.</div>
  </div>
  <table id="tbl" class="hidden">
    <thead id="thead" class="nofilter"><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";

/* ---------- enum metadata (indices MUST match the Flutter app) ---------- */
const ROLES = ['Top-order bat','Middle-order bat','Finisher','All-rounder','Wicket-keeper','Pace bowler','Spin bowler'];
const BOWLER_TYPES = ['—','Right-arm fast','Left-arm fast','Right-arm medium-fast','Right-arm swing','Left-arm swing','Right-arm off-spin','Left-arm orthodox','Right-arm leg-spin','Left-arm chinaman'];
const HANDS = ['Right-handed','Left-handed'];
const WEAKNESSES = ['—','Spin','Swing','Pace','Bouncer','Yorker','Slower ball','Flighted ball','Darted ball'];
const STRENGTHS = ['Cover drive','Cut','Pull','Hook','Sweep','Straight drive','Ramp / scoop','Slog-sweep'];
const NATIONS = [
  ['IND','India'],['AUS','Australia'],['ENG','England'],['NZ','New Zealand'],
  ['SA','South Africa'],['WI','West Indies'],['SL','Sri Lanka'],['AFG','Afghanistan'],
  ['BAN','Bangladesh'],['PAK','Pakistan'],['USA','USA'],
  // Real non-cup nations used by league (Super League / Power Bash) players —
  // they field no national side but are legal player data (mirrors the app's
  // validator, which accepts every nationality present in the stock pool).
  ['ZIM','Zimbabwe'],['OMA','Oman'],
];
const NATION_NAME = Object.fromEntries(NATIONS);
const NATION_CODES = NATIONS.map(n => n[0]);
const CUP_NATIONS = ['IND','AUS','ENG','NZ','SA','WI','SL','AFG','BAN','PAK'];
const CUSTOM_ID_BASE = 500000;
const MAX_SQUAD = 25;
const CREST_PX = 300;   // custom-logo canvas size (mirrors crest_image.dart)

/* ---------- leagues (mirror LeagueRegistry + DomesticRules in the app) ---------- */
// The default league uses per-player startingTeamId for squad membership; the
// others (PSL/BBL) use per-team `squads` manifests, so a star can turn out in
// more than one league. minSquad: the app floors non-default leagues lower
// (kLeagueMinSquadSize = 15) since they play ~15-16 man stock manifests.
const LEAGUES = {
  ipl: { id:'ipl', name:'Premier T20 (India)', short:'PT20', domestic:'IND',
    maxOverseasSquad:8, maxOverseasXI:4, minLocalXI:0, minSquad:18,
    teamIds:['mum','che','blr','kol','del','pun','raj','hyd','lko','guj'] },
  psl: { id:'psl', name:'Super League (Pakistan)', short:'SL', domestic:'PAK',
    maxOverseasSquad:8, maxOverseasXI:4, minLocalXI:7, minSquad:15,
    teamIds:['psl_isb','psl_khi','psl_lhr','psl_mul','psl_pes','psl_qet','psl_hyd','psl_rwp'] },
  bbl: { id:'bbl', name:'Power Bash (Australia)', short:'PB', domestic:'AUS',
    maxOverseasSquad:6, maxOverseasXI:3, minLocalXI:0, minSquad:15,
    teamIds:['bbl_ade','bbl_bri','bbl_hob','bbl_mlc','bbl_mlr','bbl_per','bbl_syl','bbl_sye'] },
};
const LEAGUE_ORDER = ['ipl','psl','bbl'];
const ALL_KNOWN_TEAM_IDS = new Set(LEAGUE_ORDER.flatMap(id => LEAGUES[id].teamIds));

const ATTRS = [
  ['batting','BAT','Batting'],['power','POW','Power'],['technique','TEC','Technique'],
  ['temperament','TMP','Temperament'],['aggression','AGG','Aggression'],['style','STY','Style'],
  ['running','RUN','Running'],['vsPace','vP','vs Pace'],['vsSpin','vS','vs Spin'],
  ['bowling','BOWL','Bowling'],['pace','PAC','Pace'],['control','CTR','Control'],
  ['variation','VAR','Variation'],['death','DTH','Death'],['composure','COMP','Composure'],
  ['catching','CAT','Catching'],['fielding','FLD','Fielding'],
];

/* ---------- state ---------- */
let roster = null;
let baseline = null;          // parsed default — never mutated; used by the diff view
let teamIndex = {};           // ALL teams across every customised league
let teamOrder = [];           // the ACTIVE league's team ids (chips / Team column)
let activeLeague = 'ipl';     // the league currently being edited
let playerById = {};          // id -> player, rebuilt on load / add / delete
let filterTeam = 'ALL';
let searchText = '';
let issues = [];
let issuesByTeam = {};
let sortKey = null, sortDir = 0;   // 0 none, 1 asc, -1 desc
let filtersOn = false;
let colFilters = {};               // key -> filter value

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const el = (tag, props) => Object.assign(document.createElement(tag), props || {});
function toast(msg) {
  const t = el('div', { className: 'toast', textContent: msg });
  $('#toastRoot').appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function teamLabel(id) {
  if (id === 'FREE' || id == null) return 'Free agent';
  const b = teamIndex[id];
  return b ? b.name : id;
}
function heat(v) {
  v = Math.max(0, Math.min(100, v || 0));
  const hue = (v / 100) * 130;
  return `hsla(${hue}, 60%, 40%, ${0.10 + (v/100)*0.22})`;
}

/* ---------- league + squad-membership model ----------
 * Membership is dual: the default league keeps it on each player
 * (startingTeamId); the others carry per-team `squads` manifests so one star
 * can appear in several leagues. A league "uses manifests" iff any of its
 * teams has a squads entry — true for the seeded PSL/BBL, false for IPL. */
function activeCfg() { return LEAGUES[activeLeague] || LEAGUES.ipl; }
function customizedLeagues() {
  const set = roster && roster.customizedLeagues && roster.customizedLeagues.length
    ? roster.customizedLeagues : [roster ? roster.leagueId : 'ipl'];
  return LEAGUE_ORDER.filter(id => set.includes(id));
}
function leagueUsesManifest(cfg) {
  return cfg.teamIds.some(tid => Array.isArray(roster.squads[tid]));
}
function rebuildPlayerIndex() {
  playerById = {}; for (const p of roster.players) playerById[p.id] = p;
}
// The active league's team for a player, or null (a free agent within it).
function teamOfPlayer(p) {
  const cfg = activeCfg();
  if (leagueUsesManifest(cfg)) {
    for (const tid of cfg.teamIds) {
      const man = roster.squads[tid];
      if (man && man.includes(p.id)) return tid;
    }
    return null;
  }
  return (p.startingTeamId && cfg.teamIds.includes(p.startingTeamId))
    ? p.startingTeamId : null;
}
// Reassign a player within the active league (newTeamId null = free agent).
function assignTeam(p, newTeamId) {
  const cfg = activeCfg();
  if (leagueUsesManifest(cfg)) {
    for (const tid of cfg.teamIds)
      if (roster.squads[tid]) roster.squads[tid] = roster.squads[tid].filter(id => id !== p.id);
    if (newTeamId) (roster.squads[newTeamId] = roster.squads[newTeamId] || []).push(p.id);
  } else {
    p.startingTeamId = newTeamId;
  }
}
function squadForTeam(teamId, cfg) {
  const man = roster.squads[teamId];
  if (man) return man.map(id => playerById[id]).filter(Boolean);
  return roster.players.filter(p => p.startingTeamId === teamId);
}
function isOverseasIn(p, cfg) { return p.nationality !== cfg.domestic; }

/* ---------- custom crest logos ----------
 * Stored as RAW base64 PNG (no data: prefix) in team.iconImg, matching the
 * app's TeamBrandingSpec 'iconImg' wire key. Uploads are aspect-fit into a
 * 300x300 transparent canvas — same as services/crest_image.dart. */
function crestSrc(b64) { return b64 ? 'data:image/png;base64,' + b64 : null; }
function crestImg(b64, cls) {
  const src = crestSrc(b64); if (!src) return null;
  return el('img', { className: cls || 'crest', src });
}
function resizeToCrest(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('could not read the file'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('that file is not a valid image'));
      img.onload = () => {
        const canvas = el('canvas'); canvas.width = CREST_PX; canvas.height = CREST_PX;
        const ctx = canvas.getContext('2d');
        const scale = Math.min(CREST_PX / img.width, CREST_PX / img.height);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, (CREST_PX - w) / 2, (CREST_PX - h) / 2, w, h);
        resolve(canvas.toDataURL('image/png').split(',')[1]);   // raw base64
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- auction eligibility (mirrors the game) ---------- */
const AUCTION_EXCLUDED_NATIONALITIES = ['PAK', 'BAN'];
const OVERSEAS_AUCTION_OVERALL_FLOOR = 80;
// The game's built-in default rule: international-only nationalities + overseas
// players below the rating floor are held out of the franchise auction. Used to
// SEED the editable excludeFromAuction flag for rosters that predate it, so old
// JSON (and the stock roster) come in matching the game's defaults.
function defaultAuctionExcluded(nat, batting, bowling) {
  if (AUCTION_EXCLUDED_NATIONALITIES.indexOf(nat) !== -1) return true;
  const overseas = nat !== 'IND';
  const overall = Math.max(batting || 0, bowling || 0);
  return overseas && overall <= OVERSEAS_AUCTION_OVERALL_FLOOR;
}

/* ---------- import / parse ---------- */
function parsePreset(json) {
  if (!json || json.kind !== 'criccoach_roster')
    throw new Error("That file isn't a Cricket Coach roster.");
  const schema = json.schema || 0;
  if (schema < 1 || schema > 1)
    throw new Error('Unsupported roster version — update the editor.');
  const players = (json.players || []).map(parsePlayer);
  const teams = (json.teams || []).map(t => ({
    id: t.id, name: t.name || '', nickname: t.nickname || '', shortName: t.shortName || '',
    icon: t.icon || 'shield', primaryColor: t.primaryColor || 0, secondaryColor: t.secondaryColor || 0,
    iconImg: (typeof t.iconImg === 'string' && t.iconImg.length) ? t.iconImg : null,
  }));
  let nextCustom = json.nextCustomId || CUSTOM_ID_BASE;
  for (const p of players) if (p.id >= nextCustom) nextCustom = p.id + 1;
  const leagueId = json.leagueId || 'ipl';
  // Additive/null-safe multi-league keys — a pre-multi-league file has none, so
  // customizedLeagues defaults to [leagueId] and squads/leagueNames stay empty.
  const customLeagues = Array.isArray(json.customLeagues) && json.customLeagues.length
    ? json.customLeagues.slice() : [leagueId];
  const squads = {};
  if (json.squads && typeof json.squads === 'object')

/* ---------- validation (mirrors roster_validator.dart) ---------- */
function validate() {
  issues = []; issuesByTeam = {};
  const err = (msg, team) => issues.push({ sev: 'err', msg, team });
  const warn = (msg, team) => issues.push({ sev: 'warn', msg, team });
  const seen = new Set();
  for (const p of roster.players) {
    if (seen.has(p.id)) err(`Two players share id ${p.id} (${p.name}).`);
    seen.add(p.id);
    if (!p.name.trim()) err(`A player (id ${p.id}) has no name.`);
    if (!NATION_CODES.includes(p.nationality)) err(`${p.name}: unknown nationality "${p.nationality}".`);
    if (p.startingTeamId != null && !ALL_KNOWN_TEAM_IDS.has(p.startingTeamId)) err(`${p.name}: assigned to a team that doesn't exist.`);
    if (p.age < 14 || p.age > 45) err(`${p.name}: age ${p.age} must be 14–45.`);
    const bad = attrsOutOfRange(p);
    if (bad.length) err(`${p.name}: out of range — ${bad.join(', ')}.`);
  }
  const nameCount = {};
  for (const p of roster.players) { const n = p.name.trim(); if (n) nameCount[n] = (nameCount[n]||0)+1; }
  for (const n in nameCount) if (nameCount[n] > 1) warn(`${nameCount[n]} players are named ${n}.`);

  // Per-team rules, judged for EVERY customised league by its own domestic rules
  // (domestic nationality, overseas caps, squad floor) — mirrors the app.
  for (const lid of customizedLeagues()) {
    const cfg = LEAGUES[lid]; if (!cfg) { err(`Roster customises an unknown league "${lid}".`); continue; }
    for (const tid of cfg.teamIds) {
      const b = teamIndex[tid];
      const nm = (b && b.name) || tid;
      const squad = squadForTeam(tid, cfg);
      if (!b || !b.name.trim()) err(`A team is missing its name.`, tid);
      if (b && !b.nickname.trim()) err(`${nm} needs a nickname.`, tid);
      const code = (b && b.shortName || '').trim();
      if (code.length < 2 || code.length > 4) err(`${nm} needs a 2–4 letter short code.`, tid);
      if (squad.length < cfg.minSquad || squad.length > MAX_SQUAD)
        err(`${nm} (${cfg.short}) carry ${squad.length} players — must be ${cfg.minSquad}–${MAX_SQUAD}.`, tid);
      const overseas = squad.filter(p => isOverseasIn(p, cfg)).length;
      if (overseas > cfg.maxOverseasSquad)
        err(`${nm} have ${overseas} overseas players — the ${cfg.short} squad cap is ${cfg.maxOverseasSquad}.`, tid);
      const keepers = squad.filter(p => p.role === 4 || p.canKeep).length;
      if (keepers === 0) err(`${nm} have no wicket-keeper.`, tid);
      else if (keepers === 1) warn(`${nm} have only one wicket-keeper.`, tid);
      const bowlers = squad.filter(p => p.bowling >= 50).length;
      if (bowlers < 5) err(`${nm} have only ${bowlers} players who can bowl — need at least 5.`, tid);
      const js = new Set(); let jtrouble = false;
      for (const p of squad) { if (p.jersey < 1 || p.jersey > 99 || js.has(p.jersey)) jtrouble = true; js.add(p.jersey); }
      if (jtrouble) warn(`${nm} have duplicate or out-of-range jersey numbers.`, tid);
    }
  }
  for (const code of CUP_NATIONS) {
    const n = roster.players.filter(p => p.nationality === code).length;
    if (n < 11) err(`${NATION_NAME[code]} have only ${n} players — a nation needs at least 11.`);
  }
  for (const i of issues) {
    const key = i.team || '_global';
    issuesByTeam[key] = issuesByTeam[key] || { err: 0, warn: 0 };
    issuesByTeam[key][i.sev]++;
  }
  renderValbar(); renderChips();
}
function attrsOutOfRange(p) {
  const out = [];
  const ck = (label, v, min=0, max=100) => { if (v < min || v > max) out.push(label); };
  for (const [k, code] of ATTRS) ck(code, p[k]);
  return out;
}

/* ---------- sort + filter ---------- */
function numMatch(v, expr) {
  expr = String(expr).trim(); if (!expr) return true;
  let m = expr.match(/^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)$/);
  if (m) return v >= parseFloat(m[1]) && v <= parseFloat(m[2]);
  m = expr.match(/^(>=|<=|>|<|=)?\s*(\d+(?:\.\d+)?)$/);
  if (!m) return true;
  const op = m[1] || '=', n = parseFloat(m[2]);
  switch (op) { case '>': return v > n; case '>=': return v >= n; case '<': return v < n;
    case '<=': return v <= n; default: return v === n; }
}
function passesFilters(p) {
  for (const col of COLS) {
    const f = colFilters[col.key];
    if (f == null || f === '') continue;
    if (col.kind === 'num') { if (!numMatch(col.sortVal(p), f)) return false; }
    else if (col.kind === 'cat') { if (String(col.catVal(p)) !== String(f)) return false; }
    else if (col.kind === 'bool') { const b = col.boolVal(p); if (f === 'yes' && !b) return false; if (f === 'no' && b) return false; }
    else if (col.kind === 'tags') { if (!p[col.key].includes(parseInt(f))) return false; }
    else if (col.kind === 'text') { if (!String(p[col.key]).toLowerCase().includes(String(f).toLowerCase())) return false; }
  }
  return true;
}
function activeColumns() {
  return Object.keys(colFilters).some(k => colFilters[k] !== '' && colFilters[k] != null) || sortKey;
}
function visiblePlayers() {
  let list = roster.players;
  if (filterTeam === 'FREE') list = list.filter(p => teamOfPlayer(p) == null);
  else if (filterTeam !== 'ALL') list = list.filter(p => teamOfPlayer(p) === filterTeam);
  if (searchText) { const q = searchText.toLowerCase(); list = list.filter(p => p.name.toLowerCase().includes(q)); }
  list = list.filter(passesFilters);
  const col = sortKey ? COLS.find(c => c.key === sortKey) : null;
  if (col && sortDir) {
    list = list.slice().sort((a, b) => {
      const va = col.sortVal(a), vb = col.sortVal(b);
      let c = (typeof va === 'string') ? va.localeCompare(vb) : (va - vb);
      return c * sortDir;
    });
  } else {
    list = list.slice().sort((a, b) => {
      const ta = teamOfPlayer(a) || 'zzz', tb = teamOfPlayer(b) || 'zzz';
      if (ta !== tb) return ta < tb ? -1 : 1;
      return (b.batting + b.bowling) - (a.batting + a.bowling);
    });
  }
  return list;
}

    col.tagLabels.forEach((l, i) => { if (col.hideNone && i === 0) return; ctrl.appendChild(el('option', { value: i, textContent: l })); });
  } else if (col.kind === 'num') {
    ctrl = el('input', { placeholder: '>80', title: 'e.g. >80, <50, 60-90, 75' });
  } else {
    ctrl = el('input', { placeholder: 'filter' });
  }
  ctrl.value = colFilters[col.key] || '';
  const ev = ctrl.tagName === 'SELECT' ? 'change' : 'input';
  ctrl.addEventListener(ev, () => { colFilters[col.key] = ctrl.value; renderRows(); updateClearBtn(); });
  ctrl.addEventListener('click', e => e.stopPropagation());
  wrap.appendChild(ctrl);
  return wrap;
}
function cycleSort(key) {
  if (sortKey !== key) { sortKey = key; sortDir = 1; }
  else if (sortDir === 1) sortDir = -1;
  else { sortKey = null; sortDir = 0; }
  buildHead(); renderRows(); updateClearBtn();
}
function updateClearBtn() { $('#btnClear').classList.toggle('hidden', !activeColumns()); }
function positionSticky() {
  const firstTh = $('#head').children[0];
  const w = firstTh ? firstTh.offsetWidth : 44;
  document.querySelectorAll('.sticky2').forEach(e => { e.style.left = w + 'px'; });
}
function renderRows() {
  const rows = $('#rows'); rows.innerHTML = '';
  const list = visiblePlayers();
  const frag = document.createDocumentFragment();
  for (const p of list) frag.appendChild(buildRow(p));
  rows.appendChild(frag);
  $('#tbl').classList.remove('hidden'); $('#emptyState').classList.add('hidden');
  requestAnimationFrame(positionSticky);
}
function buildRow(p) {
  const tr = el('tr'); tr.dataset.pid = p.id;
  for (const col of COLS) tr.appendChild(col.render(p));
  return tr;
}
function renderChips() {
  const chips = $('#chips'); chips.innerHTML = '';
  const mk = (id, label, count, logoB64) => {
    const c = el('div', { className: 'chip' + (filterTeam === id ? ' active' : '') });
    const it = issuesByTeam[id] || {};
    c.appendChild(el('span', { className: 'dot' + (it.err ? ' err' : it.warn ? ' warn' : '') }));
    const img = logoB64 ? crestImg(logoB64) : null; if (img) c.appendChild(img);
    c.appendChild(el('span', { textContent: label }));
    if (count != null) c.appendChild(el('span', { className: 'ct', textContent: count }));
    c.addEventListener('click', () => { filterTeam = id; renderChips(); renderRows(); });
    chips.appendChild(c);
  };
  const inLeague = roster.players.filter(p => teamOfPlayer(p) != null).length;
  mk('ALL', 'All', roster.players.length);
  mk('FREE', 'Free agents', roster.players.length - inLeague);
  for (const tid of teamOrder)
    mk(tid, teamLabel(tid), roster.players.filter(p => teamOfPlayer(p) === tid).length, teamIndex[tid] && teamIndex[tid].iconImg);
  const edit = el('div', { className: 'chip' });
  edit.appendChild(el('span', { textContent: '✎ Teams, colours & logos' }));
  edit.addEventListener('click', openTeamEditor);
  chips.appendChild(edit);
}
function renderValbar() {
  const errs = issues.filter(i => i.sev === 'err').length;
  const warns = issues.filter(i => i.sev === 'warn').length;
  const badge = $('#valBadge'), sum = $('#valSummary');
  if (errs) {
    badge.className = 'badge err'; badge.textContent = `${errs} error${errs>1?'s':''}`;
    sum.textContent = warns ? `${warns} warning${warns>1?'s':''} too. Errors must be fixed before this roster works in-game.`
      : 'Errors must be fixed before this roster works in-game.';
  } else if (warns) {
    badge.className = 'badge warn'; badge.textContent = `${warns} warning${warns>1?'s':''}`;
    sum.textContent = 'No blocking errors — warnings are safe to ignore.';
  } else {
    badge.className = 'badge ok'; badge.textContent = 'Roster OK';
    sum.textContent = 'No problems found. Ready to export.';
  }
  if (!$('#vallist').classList.contains('hidden')) renderValList();
}
function renderValList() {
  const list = $('#vallist'); list.innerHTML = '';
  if (!issues.length) { list.appendChild(el('div', { className: 'v', textContent: 'No issues.' })); return; }
  const sorted = issues.slice().sort((a,b)=> (a.sev===b.sev?0:a.sev==='err'?-1:1));
  for (const i of sorted) {
    const v = el('div', { className: 'v ' + i.sev });
    v.innerHTML = `<span class="sev">${i.sev==='err'?'ERROR':'warn'}</span>${i.msg}`;
    if (i.team) v.addEventListener('click', () => { filterTeam = i.team; renderChips(); renderRows(); });
    list.appendChild(v);
  }
}

/* ---------- modals ---------- */
function closeModal() { $('#modalRoot').innerHTML = ''; }
function modal(titleText, bodyNode, footNodes, wide) {
  const scrim = el('div', { className: 'scrim' });
  scrim.addEventListener('click', e => { if (e.target === scrim) closeModal(); });
  const m = el('div', { className: 'modal' + (wide ? ' wide' : '') });
  m.appendChild(el('h2', { textContent: titleText }));
  const body = el('div', { className: 'body' }); body.appendChild(bodyNode); m.appendChild(body);
  const foot = el('div', { className: 'foot' }); (footNodes || []).forEach(n => foot.appendChild(n)); m.appendChild(foot);
  scrim.appendChild(m); $('#modalRoot').appendChild(scrim);
}
function openTagPicker(p, key, labels, hideNone, onDone) {
  const body = el('div', { className: 'checklist' });
  labels.forEach((label, idx) => {
    if (hideNone && idx === 0) return;
    const lab = el('label');
    const cb = el('input', { type: 'checkbox', checked: p[key].includes(idx) });
    cb.addEventListener('change', () => {
      if (cb.checked) { if (!p[key].includes(idx)) p[key].push(idx); }
      else p[key] = p[key].filter(x => x !== idx);
    });
    lab.appendChild(cb); lab.appendChild(el('span', { textContent: label })); body.appendChild(lab);
  });
  const done = el('button', { className: 'primary', textContent: 'Done' });
  done.addEventListener('click', () => { closeModal(); onDone(); validate(); });
  const titles = { weaknesses: 'Bowling weaknesses', strengths: 'Favourite shots (strengths)', shotWeaknesses: 'Shots they mishit' };
  modal(`${p.name} — ${titles[key]}`, body, [done]);
}
function openTeamEditor() {
  const cfg = activeCfg();
  const body = el('div');
  body.appendChild(el('div', { className: 'note', style: 'margin-bottom:12px',
    innerHTML: `Rebrand any <b>${cfg.name}</b> franchise. The ${teamOrder.length} teams and their internal ids are fixed; you can change names, nicknames, short codes, colours and upload a custom logo (any image — it is resized to 300×300 and embedded in the exported roster).` }));
  for (const tid of teamOrder) {
    const b = teamIndex[tid];
    const box = el('div', { style: 'border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px' });
    const mkField = (label, key, kind) => {
      const r = el('div', { className: 'row' }); r.appendChild(el('label', { textContent: label }));
      if (kind === 'color') {
        const argb = b[key] >>> 0; const hex = '#' + (argb & 0xFFFFFF).toString(16).padStart(6, '0');
        const i = el('input', { type: 'color', value: hex });
        i.addEventListener('change', () => { b[key] = (0xFF000000 | parseInt(i.value.slice(1), 16)) >>> 0; });
        r.appendChild(i);
      } else {
        const i = el('input', { value: b[key] });
        i.addEventListener('change', () => { b[key] = i.value; validate(); renderChips(); });
        r.appendChild(i);
      }
      box.appendChild(r);
    };
    box.appendChild(el('div', { style: 'font-weight:650;margin-bottom:6px', textContent: `${b.shortName} — ${b.name}` }));
    box.appendChild(logoRow(b));
    mkField('Name', 'name'); mkField('Nickname', 'nickname'); mkField('Short code (2-4)', 'shortName');
    mkField('Primary colour', 'primaryColor', 'color'); mkField('Secondary colour', 'secondaryColor', 'color');
    body.appendChild(box);
  }
  const done = el('button', { className: 'primary', textContent: 'Done' }); done.addEventListener('click', closeModal);
  modal(`Edit teams — ${cfg.name}`, body, [done]);
}
// Custom-logo row inside the team editor: preview + upload/replace/remove.
function logoRow(b) {
  const row = el('div', { className: 'logo-row' });
  const slot = el('div');
  const refreshSlot = () => {
    slot.innerHTML = '';
    const img = crestImg(b.iconImg, 'crest-lg');
    if (img) slot.appendChild(img);
    else { const ph = el('div', { className: 'logo-slot', textContent: 'no logo' }); slot.appendChild(ph); }
  };
  refreshSlot();
  const btns = el('div', { className: 'btns' });
  const file = el('input', { type: 'file', accept: 'image/*', className: 'hidden' });
  const up = el('button', { textContent: b.iconImg ? 'Replace logo' : 'Upload logo' });
  up.addEventListener('click', () => file.click());
  file.addEventListener('change', async () => {
    const f = file.target ? file.target.files[0] : file.files[0]; file.value = '';
    if (!f) return;
    try {
      b.iconImg = await resizeToCrest(f);
      refreshSlot(); up.textContent = 'Replace logo'; rm.classList.remove('hidden');
      renderChips(); toast('Logo set (300×300).');
    } catch (e) { alert('Could not use that image:\n' + e.message); }
  });
  const rm = el('button', { className: 'danger' + (b.iconImg ? '' : ' hidden'), textContent: 'Remove' });
  rm.addEventListener('click', () => {
    b.iconImg = null; refreshSlot(); up.textContent = 'Upload logo'; rm.classList.add('hidden'); renderChips();
  });
  btns.appendChild(up); btns.appendChild(rm); btns.appendChild(file);
  const wrap = el('div');
  wrap.appendChild(btns);
  wrap.appendChild(el('div', { className: 'note', style: 'margin-top:5px', textContent: 'Overrides the Material icon everywhere the crest shows.' }));
  row.appendChild(slot); row.appendChild(wrap);
  return row;
}

/* ---------- diff vs default ---------- */
const PLAYER_FIELDS = [
  ['name','Name', v=>v],
  ['startingTeamId','Team', v=>v==null?'Free agent':(teamLabel(v))],
  ['nationality','Nationality', v=>NATION_NAME[v]||v],
  ['age','Age', v=>v],
  ['role','Role', v=>ROLES[v]],
  ['canKeep','Can keep', v=>v?'yes':'no'],
  ['handedness','Bat hand', v=>HANDS[v]],
  ['bowlerType','Bowler type', v=>BOWLER_TYPES[v]],
  ['jersey','Jersey', v=>v],
  ...ATTRS.map(([k,code,full]) => [k, `${code} (${full})`, v=>v]),
  ['basePrice','Base price', v=>v],
  ['excludeFromAuction','Excl. auction', v=>v?'yes':'no'],
];
const TAG_FIELDS = [
  ['weaknesses','Weaknesses', WEAKNESSES],
  ['strengths','Strengths', STRENGTHS],
  ['shotWeaknesses','Mishit shots', STRENGTHS],
];
function tagSetStr(arr, labels) { return arr.map(i => labels[i]).join(', ') || '—'; }
function computeDiff() {
  const baseById = {}; for (const p of baseline.players) baseById[p.id] = p;
  const curById = {}; for (const p of roster.players) curById[p.id] = p;
  const modified = [], added = [], removed = [];
  for (const p of roster.players) {
    const b = baseById[p.id];
    if (!b) { added.push(p); continue; }
    const fields = [];
    for (const [key, label, fmt] of PLAYER_FIELDS) {
      const ov = b[key], nv = p[key];
      if (ov !== nv) fields.push({ label, old: fmt(ov), new: fmt(nv) });
    }
    for (const [key, label, labels] of TAG_FIELDS) {
      const os = tagSetStr(b[key], labels), ns = tagSetStr(p[key], labels);
      if (os !== ns) fields.push({ label, old: os, new: ns });
    }
    if (fields.length) modified.push({ p, b, fields });
  }
  for (const p of baseline.players) if (!curById[p.id]) removed.push(p);
  // team branding diffs
  const teamDiffs = [];
  for (const t of roster.teams) {
    const bt = baseline.teams.find(x => x.id === t.id); if (!bt) continue;
    const fields = [];
    for (const [k, l] of [['name','Name'],['nickname','Nickname'],['shortName','Short code'],['icon','Icon']])
      if (t[k] !== bt[k]) fields.push({ label: l, old: bt[k], new: t[k] });
    if ((t.iconImg || null) !== (bt.iconImg || null))
      fields.push({ label: 'Custom logo', old: bt.iconImg ? 'set' : 'none', new: t.iconImg ? 'set' : 'none' });
    for (const [k, l] of [['primaryColor','Primary colour'],['secondaryColor','Secondary colour']])
      if ((t[k]>>>0) !== (bt[k]>>>0)) fields.push({ label: l, old: '#'+((bt[k]>>>0)&0xFFFFFF).toString(16).padStart(6,'0'), new: '#'+((t[k]>>>0)&0xFFFFFF).toString(16).padStart(6,'0') });
    if (fields.length) teamDiffs.push({ t, fields });
  }
  return { modified, added, removed, teamDiffs };
}
function openDiff() {
  const d = computeDiff();
  const body = el('div');
  body.appendChild(el('div', { className: 'note', style: 'margin-bottom:12px',
    textContent: 'Everything this roster changes versus the default the game ships with. Use it to review exactly what would change if this roster became the new default.' }));
  const sum = el('div', { className: 'diff-summary' });
  const stat = (n, label, color) => {
    const s = el('div', { className: 'diff-stat' });
    s.appendChild(el('b', { textContent: n, style: color ? `color:${color}` : '' }));
    s.appendChild(el('span', { textContent: label }));
    sum.appendChild(s);
  };
  stat(d.modified.length, 'players edited', '#e3b341');
  stat(d.added.length, 'players added', '#56d364');
  stat(d.removed.length, 'players removed', '#ff7b72');
  stat(d.teamDiffs.length, 'teams rebranded', '#4f9dff');
  body.appendChild(sum);

  if (!d.modified.length && !d.added.length && !d.removed.length && !d.teamDiffs.length) {
    body.appendChild(el('div', { className: 'diff-none', textContent: 'No changes — this roster is identical to the default.' }));
  }
  const section = (title, nodes) => {
    if (!nodes.length) return;
    const sec = el('div', { className: 'diff-sec' });
    sec.appendChild(el('h3', { textContent: `${title} (${nodes.length})` }));
    nodes.forEach(n => sec.appendChild(n)); body.appendChild(sec);
  };
  const where = p => p.startingTeamId == null ? 'Free agent' : teamLabel(p.startingTeamId);

  section('Players edited', d.modified.map(({ p, fields }) => {
    const box = el('div', { className: 'diff-player' });
    const h = el('div', { className: 'ph' });
    h.appendChild(el('span', { textContent: p.name }));
    h.appendChild(el('span', { className: 'where', textContent: where(p) }));
    box.appendChild(h);
    for (const f of fields) {
      const row = el('div', { className: 'diff-field' });
      row.innerHTML = `<span class="fk">${f.label}</span><span class="old">${escapeHtml(String(f.old))}</span><span class="arrowc">→</span><span class="new">${escapeHtml(String(f.new))}</span>`;
      box.appendChild(row);
    }
    return box;
  }));
  section('Players added', d.added.map(p => {
    const box = el('div', { className: 'diff-player' });
    const h = el('div', { className: 'ph' });
    h.appendChild(el('span', { className: 'badge-add', textContent: 'NEW' }));
    h.appendChild(el('span', { textContent: p.name }));
    h.appendChild(el('span', { className: 'where', textContent: `${where(p)} · ${ROLES[p.role]} · ${NATION_NAME[p.nationality]||p.nationality} · BAT ${p.batting} / BOWL ${p.bowling}` }));
    box.appendChild(h); return box;
  }));
  section('Players removed', d.removed.map(p => {
    const box = el('div', { className: 'diff-player' });
    const h = el('div', { className: 'ph' });
    h.appendChild(el('span', { className: 'badge-del', textContent: 'REMOVED' }));
    h.appendChild(el('span', { textContent: p.name }));
    h.appendChild(el('span', { className: 'where', textContent: `${p.startingTeamId == null ? 'Free agent' : teamLabel(p.startingTeamId)} · ${ROLES[p.role]} · ${NATION_NAME[p.nationality]||p.nationality}` }));
    box.appendChild(h); return box;
  }));
  section('Teams rebranded', d.teamDiffs.map(({ t, fields }) => {
    const box = el('div', { className: 'diff-player' });
    box.appendChild(el('div', { className: 'ph', textContent: `${t.shortName} — ${t.name}` }));
    for (const f of fields) {
      const row = el('div', { className: 'diff-field' });
      row.innerHTML = `<span class="fk">${f.label}</span><span class="old">${escapeHtml(String(f.old))}</span><span class="arrowc">→</span><span class="new">${escapeHtml(String(f.new))}</span>`;
      box.appendChild(row);
    }
    return box;
  }));

  const close = el('button', { className: 'primary', textContent: 'Close' }); close.addEventListener('click', closeModal);
  modal('Changes vs default roster', body, [close], true);
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

/* ---------- add player ---------- */
function addPlayer() {
  let nextId = CUSTOM_ID_BASE;
  for (const p of roster.players) if (p.id >= nextId) nextId = p.id + 1;
  const team = (filterTeam === 'ALL' || filterTeam === 'FREE') ? null : filterTeam;
  const cfg = activeCfg();
  const p = parsePlayer({
    id: nextId, name: 'New Player', jersey: 1, role: 1, bowlerType: 0, handedness: 0,
    nationality: cfg.domestic, startingTeamId: null, weaknesses: [], strengths: [], shotWeaknesses: [],
    evolving: { age: 24, batting: 50, power: 50, technique: 50, temperament: 50, aggression: 50,
      style: 50, running: 50, vsPace: 50, vsSpin: 50, bowling: 30, pace: 50, control: 50,
      variation: 50, death: 50, composure: 50, catching: 50, fielding: 50, form: 60, morale: 7, staminaPct: 100 },
  });
  roster.players.push(p);
  rebuildPlayerIndex();
  if (team) assignTeam(p, team);   // honours the active league's manifest/startingTeamId model
  searchText = ''; $('#search').value = '';
  renderRows(); validate();
  toast(`Added player (id ${p.id})`);
}

/* ---------- file I/O ---------- */
let loadedSource = 'default_roster.json';
function loadRoster(json) {
  roster = parsePreset(json);
  teamIndex = {}; for (const t of roster.teams) teamIndex[t.id] = t;
  rebuildPlayerIndex();
  const leagues = customizedLeagues();
  setActiveLeague(leagues.includes(roster.leagueId) ? roster.leagueId : leagues[0]);
}
function setActiveLeague(lid) {
  activeLeague = lid;
  teamOrder = activeCfg().teamIds.filter(t => teamIndex[t]);
  filterTeam = 'ALL'; sortKey = null; sortDir = 0; colFilters = {};
  renderLeagueSwitch();
  buildColumns(); buildHead(); renderChips(); renderRows(); validate(); updateClearBtn();
}
function renderLeagueSwitch() {
  const sel = $('#leagueSwitch'); const leagues = customizedLeagues();
  sel.innerHTML = '';
  for (const lid of leagues) sel.appendChild(el('option', { value: lid, textContent: LEAGUES[lid].name }));
  sel.value = activeLeague;
  sel.classList.toggle('hidden', leagues.length <= 1);
}
function fetchRoster(url) {
  fetch(url)
    .then(r => { if (!r.ok) throw new Error(url + ' not found'); return r.json(); })
    .then(j => { loadRoster(j); loadedSource = url; $('#rosterSource').value = url; toast('Roster loaded.'); })
    .catch(e => {
      $('#emptyState').querySelector('.big').textContent = 'Could not load that roster.';
      $('#emptyState').querySelector('.note').textContent = e.message + ' — use “Import roster…” to open a file instead.';
    });
}
function loadSource(url) {
  if (roster && !confirm('Discard current edits and load this roster?')) {
    $('#rosterSource').value = loadedSource; return;
  }
  fetchRoster(url);
}
function doExport() {
  const json = rosterToJson();
  const blob = new Blob([JSON.stringify(json)], { type: 'application/json' });
  const slug = (json.name || 'roster').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '') || 'roster';
  const a = el('a', { href: URL.createObjectURL(blob), download: `criccoach-roster-${slug}.json` });
  document.body.appendChild(a); a.click(); a.remove();
  const errs = issues.filter(i => i.sev === 'err').length;
  toast(errs ? `Exported — but ${errs} error(s) remain; fix them or the app will reject it.` : 'Exported. Send this file back!');
}
function importFile(file) {
  const fr = new FileReader();
  fr.onload = () => { try { loadRoster(JSON.parse(fr.result)); markImportedSource(file.name); toast('Roster loaded.'); }
    catch (e) { alert('Could not load that file:\n' + e.message); } };
  fr.readAsText(file);
}
function markImportedSource(fname) {
  const sel = $('#rosterSource');
  let opt = sel.querySelector('option[value="__file__"]');
  if (!opt) { opt = el('option', { value: '__file__' }); sel.appendChild(opt); }
  opt.textContent = 'Imported: ' + (fname || 'file');
  sel.value = '__file__'; loadedSource = '__file__';
}

/* ---------- wiring ---------- */
$('#btnImport').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; });
$('#btnExport').addEventListener('click', doExport);
$('#btnDiff').addEventListener('click', () => { if (!roster || !baseline) return; openDiff(); });
$('#btnAdd').addEventListener('click', addPlayer);
$('#rosterSource').addEventListener('change', e => {
  const v = e.target.value;
  if (v === '__file__') return;   // the "Imported: …" pseudo-entry isn't fetchable
  loadSource(v);
});
$('#leagueSwitch').addEventListener('change', e => setActiveLeague(e.target.value));
$('#btnFilters').addEventListener('click', () => {
  filtersOn = !filtersOn;
  $('#btnFilters').classList.toggle('on', filtersOn);
  $('#thead').classList.toggle('nofilter', !filtersOn);
  requestAnimationFrame(positionSticky);
});
$('#btnClear').addEventListener('click', () => {
  colFilters = {}; sortKey = null; sortDir = 0;
  buildHead(); renderRows(); updateClearBtn();
});
$('#search').addEventListener('input', e => { searchText = e.target.value.trim(); renderRows(); });
$('#valbar').addEventListener('click', () => {
  const l = $('#vallist'); l.classList.toggle('hidden');
  if (!l.classList.contains('hidden')) renderValList();
});
window.addEventListener('beforeunload', e => { if (roster) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', positionSticky);

function boot() {
  // The diff view always compares against the default roster, so load it as the
  // baseline once at startup. ?roster= / ?league= pick the initial view (a
  // shareable deep-link, e.g. ?roster=roster_stock_all.json&league=psl).
  const params = new URLSearchParams(location.search);
  const wantSources = ['default_roster.json','community_roster.json','roster_stock_all.json'];
  const src = wantSources.includes(params.get('roster')) ? params.get('roster') : 'default_roster.json';
  const wantLeague = params.get('league');
  fetch('default_roster.json')
    .then(r => { if (!r.ok) throw new Error('default_roster.json not found'); return r.json(); })
    .then(j => baseline = parsePreset(j))
    .catch(() => { baseline = null; })
    .finally(() => fetch(src)
      .then(r => { if (!r.ok) throw new Error(src + ' not found'); return r.json(); })
      .then(j => {
        loadRoster(j); loadedSource = src; $('#rosterSource').value = src;
        if (wantLeague && customizedLeagues().includes(wantLeague)) setActiveLeague(wantLeague);
      })
      .catch(e => {
        $('#emptyState').querySelector('.big').textContent = 'Could not load the roster.';
        $('#emptyState').querySelector('.note').textContent = e.message + ' — use “Import roster…” to open a file instead.';
      }));
}
boot();
</script>
