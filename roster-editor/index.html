<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cricket Coach — Roster Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%8F%8F%3C/text%3E%3C/svg%3E" />
<meta name="description" content="Edit the Cricket Coach player pool in a spreadsheet, then export your roster." />
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel2: #1c232d;
    --line: #2a313c;
    --text: #e6edf3;
    --muted: #8b97a7;
    --accent: #4f9dff;
    --good: #2ea043;
    --warn: #d29922;
    --bad: #f85149;
    --chip: #222a35;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .grow { flex: 1; }
  button, .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
    font-weight: 550; white-space: nowrap;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04101f; }
  button.danger { color: var(--bad); }
  button.toggle.on { background: var(--accent); border-color: var(--accent); color: #04101f; }
  button:disabled { opacity: .45; cursor: default; }
  input, select { font: inherit; color: var(--text); }
  .toolbar2 {
    padding: 8px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel);
  }
  .search {
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 10px; min-width: 200px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px;
  }
  .chip.active { background: var(--accent); color: #04101f; border-color: var(--accent); }
  .chip .ct { opacity: .7; font-variant-numeric: tabular-nums; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
  .chip .dot.err { background: var(--bad); }
  .chip .dot.warn { background: var(--warn); }
  .wrap { flex: 1; overflow: auto; position: relative; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; }
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; }
  thead th {
    position: sticky; top: 0; z-index: 3; background: var(--panel2);
    vertical-align: top; white-space: nowrap;
  }
  thead th .hlabel {
    padding: 7px 8px 6px; font-size: 11px; color: var(--muted); text-align: center;
    font-weight: 600; letter-spacing: .3px; cursor: pointer; user-select: none;
  }
  thead th .hlabel.nosort { cursor: default; }
  thead th .hlabel:hover:not(.nosort) { color: var(--text); }
  thead th .hlabel .full { display: block; font-size: 9px; color: #5c6675; font-weight: 400; }
  thead th .hlabel .arrow { color: var(--accent); font-size: 10px; }
  thead th .hfilter { padding: 0 4px 5px; }
  thead th .hfilter input, thead th .hfilter select {
    width: 100%; min-width: 52px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 4px; font-size: 11px; text-align: center;
  }
  thead.nofilter th .hfilter { display: none; }
  tbody td { background: var(--panel); height: 30px; }
  tbody tr:hover td { background: #1a212b; }
  td input, td select {
    background: transparent; border: 0; width: 100%; height: 30px; padding: 0 7px;
    outline: none; text-align: center;
  }
  td.txt input { text-align: left; }
  td input:focus, td select:focus { background: #0c1722; box-shadow: inset 0 0 0 1.5px var(--accent); }
  td.num input { font-variant-numeric: tabular-nums; }
  td select { cursor: pointer; appearance: none; -webkit-appearance: none; }
  .sticky1 { position: sticky; left: 0; z-index: 2; }
  .sticky2 { position: sticky; z-index: 2; }
  thead .sticky1, thead .sticky2 { z-index: 4; }
  td.sticky1, td.sticky2 { background: var(--panel2); border-right: 1px solid var(--line); }
  tbody tr:hover td.sticky1, tbody tr:hover td.sticky2 { background: #232c38; }
  .rowtools { display: flex; gap: 2px; justify-content: center; }
  .rowtools button { padding: 2px 6px; font-size: 11px; border-radius: 5px; }
  .tagcell { padding: 0 6px; cursor: pointer; min-height: 30px; display: flex; align-items: center; flex-wrap: wrap; gap: 3px; justify-content: center; }
  .tag { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 10.5px; }
  .tag.empty { color: #5c6675; }
  .valbar {
    padding: 7px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .valbar .badge { padding: 3px 9px; border-radius: 6px; font-weight: 650; font-size: 12px; }
  .valbar .badge.ok { background: rgba(46,160,67,.18); color: #56d364; }
  .valbar .badge.err { background: rgba(248,81,73,.16); color: #ff7b72; }
  .valbar .badge.warn { background: rgba(210,153,34,.16); color: #e3b341; }
  .vallist { max-height: 30vh; overflow: auto; border-bottom: 1px solid var(--line); background: var(--bg); }
  .vallist .v { padding: 6px 16px; border-bottom: 1px solid #1a2029; font-size: 12px; cursor: pointer; }
  .vallist .v:hover { background: var(--panel); }
  .vallist .v .sev { font-weight: 700; margin-right: 8px; }
  .vallist .v.err .sev { color: var(--bad); }
  .vallist .v.warn .sev { color: var(--warn); }
  .hidden { display: none !important; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: center; justify-content: center; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(640px, 94vw); max-height: 88vh; overflow: auto; }
  .modal.wide { width: min(820px, 96vw); }
  .modal h2 { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 14px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .modal .body { padding: 14px 18px; }
  .modal .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .modal .row label { width: 150px; color: var(--muted); font-size: 12px; }
  .modal .row input, .modal .row select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; flex: 1; }
  .modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--panel); }
  .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .checklist label { display: flex; align-items: center; gap: 7px; width: auto; color: var(--text); font-size: 12.5px; padding: 3px 0; cursor: pointer; }
  .checklist input { flex: none; width: auto; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty-state .big { font-size: 16px; color: var(--text); margin-bottom: 8px; }
  .note { color: var(--muted); font-size: 11.5px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); color: var(--text); padding: 10px 18px; border-radius: 8px; z-index: 80; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  /* diff */
  .diff-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .diff-stat { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .diff-stat b { font-size: 18px; display: block; }
  .diff-stat span { font-size: 11px; color: var(--muted); }
  .diff-sec { margin-bottom: 16px; }
  .diff-sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .diff-player { border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; margin-bottom: 7px; background: var(--bg); }
  .diff-player .ph { font-weight: 650; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .diff-player .ph .where { font-size: 11px; color: var(--muted); font-weight: 400; }
  .diff-player .badge-add { color: #56d364; font-size: 11px; font-weight: 700; }
  .diff-player .badge-del { color: #ff7b72; font-size: 11px; font-weight: 700; }
  .diff-field { font-size: 12px; margin: 2px 0; }
  .diff-field .fk { color: var(--muted); display: inline-block; min-width: 92px; }
  .old { color: #ff7b72; }
  .arrowc { color: var(--muted); margin: 0 5px; }
  .new { color: #56d364; }
  .diff-none { color: var(--muted); padding: 30px; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Cricket Coach Roster Editor <small>edit teams &amp; players, export your version</small></h1>
  <span class="grow"></span>
  <input id="contributor" class="search" style="min-width:160px" placeholder="Your name (optional)" />
  <button id="btnDiff">Diff vs default</button>
  <button id="btnImport">Import roster…</button>
  <button id="btnDefault">Load default</button>
  <button id="btnExport" class="primary">Export roster</button>
  <input id="fileInput" type="file" accept=".json,application/json" class="hidden" />
</header>

<div id="valbar" class="valbar">
  <span id="valBadge" class="badge ok">Roster OK</span>
  <span id="valSummary" class="note">No problems found.</span>
  <span class="grow"></span>
  <span class="note">click to view issues ▾</span>
</div>
<div id="vallist" class="vallist hidden"></div>

<div class="toolbar2">
  <input id="search" class="search" placeholder="Search player name…" />
  <div id="chips" class="chips"></div>
  <span class="grow"></span>
  <button id="btnFilters" class="toggle">Column filters</button>
  <button id="btnClear" class="hidden">Clear sort/filters</button>
  <button id="btnAdd">+ Add player</button>
</div>

<div class="wrap" id="wrap">
  <div id="emptyState" class="empty-state">
    <div class="big">Loading default roster…</div>
    <div class="note">If nothing appears, click “Load default”, or “Import roster…” to open a file someone shared.</div>
  </div>
  <table id="tbl" class="hidden">
    <thead id="thead" class="nofilter"><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";

/* ---------- enum metadata (indices MUST match the Flutter app) ---------- */
const ROLES = ['Top-order bat','Middle-order bat','Finisher','All-rounder','Wicket-keeper','Pace bowler','Spin bowler'];
const BOWLER_TYPES = ['—','Right-arm fast','Left-arm fast','Right-arm medium-fast','Right-arm swing','Left-arm swing','Right-arm off-spin','Left-arm orthodox','Right-arm leg-spin','Left-arm chinaman'];
const HANDS = ['Right-handed','Left-handed'];
const WEAKNESSES = ['—','Spin','Swing','Pace','Bouncer','Yorker','Slower ball','Flighted ball','Darted ball'];
const STRENGTHS = ['Cover drive','Cut','Pull','Hook','Sweep','Straight drive','Ramp / scoop','Slog-sweep'];
const NATIONS = [
  ['IND','India'],['AUS','Australia'],['ENG','England'],['NZ','New Zealand'],
  ['SA','South Africa'],['WI','West Indies'],['SL','Sri Lanka'],['AFG','Afghanistan'],
  ['BAN','Bangladesh'],['PAK','Pakistan'],['USA','USA'],
];
const NATION_NAME = Object.fromEntries(NATIONS);
const NATION_CODES = NATIONS.map(n => n[0]);
const CUP_NATIONS = ['IND','AUS','ENG','NZ','SA','WI','SL','AFG','BAN','PAK'];
const CUSTOM_ID_BASE = 500000;
const MIN_SQUAD = 18, MAX_SQUAD = 25, MAX_OVERSEAS = 8;

const ATTRS = [
  ['batting','BAT','Batting'],['power','POW','Power'],['technique','TEC','Technique'],
  ['temperament','TMP','Temperament'],['aggression','AGG','Aggression'],['style','STY','Style'],
  ['running','RUN','Running'],['vsPace','vP','vs Pace'],['vsSpin','vS','vs Spin'],
  ['bowling','BOWL','Bowling'],['pace','PAC','Pace'],['control','CTR','Control'],
  ['variation','VAR','Variation'],['death','DTH','Death'],['composure','COMP','Composure'],
  ['catching','CAT','Catching'],['fielding','FLD','Fielding'],
];

/* ---------- state ---------- */
let roster = null;
let baseline = null;          // parsed default — never mutated; used by the diff view
let teamIndex = {};
let teamOrder = [];
let filterTeam = 'ALL';
let searchText = '';
let issues = [];
let issuesByTeam = {};
let sortKey = null, sortDir = 0;   // 0 none, 1 asc, -1 desc
let filtersOn = false;
let colFilters = {};               // key -> filter value

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const el = (tag, props) => Object.assign(document.createElement(tag), props || {});
function toast(msg) {
  const t = el('div', { className: 'toast', textContent: msg });
  $('#toastRoot').appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function teamLabel(id) {
  if (id === 'FREE' || id == null) return 'Free agent';
  const b = teamIndex[id];
  return b ? b.name : id;
}
function heat(v) {
  v = Math.max(0, Math.min(100, v || 0));
  const hue = (v / 100) * 130;
  return `hsla(${hue}, 60%, 40%, ${0.10 + (v/100)*0.22})`;
}

/* ---------- import / parse ---------- */
function parsePreset(json) {
  if (!json || json.kind !== 'criccoach_roster')
    throw new Error("That file isn't a Cricket Coach roster.");
  const schema = json.schema || 0;
  if (schema < 1 || schema > 1)
    throw new Error('Unsupported roster version — update the editor.');
  const players = (json.players || []).map(parsePlayer);
  const teams = (json.teams || []).map(t => ({
    id: t.id, name: t.name || '', nickname: t.nickname || '', shortName: t.shortName || '',
    icon: t.icon || 'shield', primaryColor: t.primaryColor || 0, secondaryColor: t.secondaryColor || 0,
  }));
  let nextCustom = json.nextCustomId || CUSTOM_ID_BASE;
  for (const p of players) if (p.id >= nextCustom) nextCustom = p.id + 1;
  return {
    id: json.id || 'roster', name: json.name || 'Roster',
    createdAt: json.createdAt || new Date().toISOString(),
    updatedAt: json.updatedAt || new Date().toISOString(),
    nextCustomId: Math.max(CUSTOM_ID_BASE, nextCustom),
    teams, players,
  };
}
function parsePlayer(j) {
  const e = j.evolving || {};
  return {
    id: j.id, name: j.name || '', jersey: j.jersey != null ? j.jersey : (e.jerseyNumber || 0),
    role: j.role || 0, canKeep: !!j.canKeep, bowlerType: j.bowlerType || 0,
    handedness: j.handedness || 0, nationality: j.nationality || 'IND',
    startingTeamId: j.startingTeamId != null ? j.startingTeamId : null,
    weaknesses: (j.weaknesses || []).slice(),
    strengths: (j.strengths || []).slice(),
    shotWeaknesses: (j.shotWeaknesses || []).slice(),
    age: e.age != null ? e.age : 24,
    batting: e.batting||0, power: e.power||0, technique: e.technique||0, temperament: e.temperament||0,
    aggression: e.aggression||0, style: e.style||0, running: e.running||0, vsPace: e.vsPace||0, vsSpin: e.vsSpin||0,
    bowling: e.bowling||0, pace: e.pace||0, control: e.control||0, variation: e.variation||0, death: e.death||0,
    composure: e.composure||0, catching: e.catching||0, fielding: e.fielding||0,
    fitness: e.fitness != null ? e.fitness : null,
    form: e.form != null ? e.form : 60, morale: e.morale != null ? e.morale : 7,
    staminaPct: e.staminaPct != null ? e.staminaPct : 100, isCaptain: !!e.isCaptain,
    avgRuns: e.avgRuns||0, avgStrikeRate: e.avgStrikeRate||0, avgEconomy: e.avgEconomy||0,
    avgBowlAvg: e.avgBowlAvg||0, wickets: e.wickets||0,
    injuredDays: e.injuredDays||0, injuryDesc: e.injuryDesc || '',
    basePrice: e.basePrice||0, soldPrice: e.soldPrice||0, soldViaRtm: !!e.soldViaRtm,
  };
}

/* ---------- export ---------- */
function playerToJson(p) {
  const ev = {
    age: p.age, jerseyNumber: p.jersey,
    batting: p.batting, power: p.power, technique: p.technique, temperament: p.temperament,
    aggression: p.aggression, style: p.style, running: p.running, vsPace: p.vsPace, vsSpin: p.vsSpin,
    bowling: p.bowling, pace: p.pace, control: p.control, variation: p.variation, death: p.death,
    composure: p.composure, catching: p.catching, fielding: p.fielding,
  };
  if (p.fitness != null) ev.fitness = p.fitness;
  ev.form = p.form; ev.morale = p.morale; ev.staminaPct = p.staminaPct; ev.isCaptain = p.isCaptain;
  ev.avgRuns = p.avgRuns; ev.avgStrikeRate = p.avgStrikeRate; ev.avgEconomy = p.avgEconomy;
  ev.avgBowlAvg = p.avgBowlAvg; ev.wickets = p.wickets; ev.injuredDays = p.injuredDays;
  if (p.injuryDesc) ev.injuryDesc = p.injuryDesc;
  if (p.basePrice) ev.basePrice = p.basePrice;
  if (p.soldPrice) ev.soldPrice = p.soldPrice;
  if (p.soldViaRtm) ev.soldViaRtm = true;
  const out = { id: p.id, name: p.name, jersey: p.jersey, role: p.role };
  if (p.canKeep) out.canKeep = true;
  out.bowlerType = p.bowlerType; out.handedness = p.handedness; out.nationality = p.nationality;
  if (p.startingTeamId != null) out.startingTeamId = p.startingTeamId;
  out.weaknesses = p.weaknesses.slice();
  out.strengths = p.strengths.slice();
  out.shotWeaknesses = p.shotWeaknesses.slice();
  out.evolving = ev;
  return out;
}
function rosterToJson() {
  let nextCustom = CUSTOM_ID_BASE;
  for (const p of roster.players) if (p.id >= nextCustom) nextCustom = p.id + 1;
  const contributor = $('#contributor').value.trim();
  let name = roster.name;
  if (contributor) {
    name = name.replace(/\s*\(edited by .*\)\s*$/, '');
    name = `${name} (edited by ${contributor})`;
  }
  return {
    schema: 1, kind: 'criccoach_roster', id: roster.id, name,
    createdAt: roster.createdAt, updatedAt: new Date().toISOString(),
    nextCustomId: nextCustom,
    teams: roster.teams.map(t => ({
      id: t.id, name: t.name, nickname: t.nickname, shortName: t.shortName,
      icon: t.icon, primaryColor: t.primaryColor, secondaryColor: t.secondaryColor,
    })),
    players: roster.players.map(playerToJson),
  };
}

/* ---------- validation (mirrors roster_validator.dart) ---------- */
function validate() {
  issues = []; issuesByTeam = {};
  const err = (msg, team) => issues.push({ sev: 'err', msg, team });
  const warn = (msg, team) => issues.push({ sev: 'warn', msg, team });
  const seen = new Set();
  for (const p of roster.players) {
    if (seen.has(p.id)) err(`Two players share id ${p.id} (${p.name}).`);
    seen.add(p.id);
    if (!p.name.trim()) err(`A player (id ${p.id}) has no name.`);
    if (!NATION_CODES.includes(p.nationality)) err(`${p.name}: unknown nationality "${p.nationality}".`);
    if (p.startingTeamId != null && !teamIndex[p.startingTeamId]) err(`${p.name}: assigned to a team that doesn't exist.`);
    if (p.age < 14 || p.age > 45) err(`${p.name}: age ${p.age} must be 14–45.`);
    const bad = attrsOutOfRange(p);
    if (bad.length) err(`${p.name}: out of range — ${bad.join(', ')}.`);
  }
  const nameCount = {};
  for (const p of roster.players) { const n = p.name.trim(); if (n) nameCount[n] = (nameCount[n]||0)+1; }
  for (const n in nameCount) if (nameCount[n] > 1) warn(`${nameCount[n]} players are named ${n}.`);
  for (const tid of teamOrder) {
    const b = teamIndex[tid];
    const squad = roster.players.filter(p => p.startingTeamId === tid);
    const nm = (b && b.name) || tid;
    if (!b || !b.name.trim()) err(`A team is missing its name.`, tid);
    if (b && !b.nickname.trim()) err(`${nm} needs a nickname.`, tid);
    const code = (b && b.shortName || '').trim();
    if (code.length < 2 || code.length > 4) err(`${nm} needs a 2–4 letter short code.`, tid);
    if (squad.length < MIN_SQUAD || squad.length > MAX_SQUAD)
      err(`${nm} carry ${squad.length} players — must be ${MIN_SQUAD}–${MAX_SQUAD}.`, tid);
    const overseas = squad.filter(p => p.nationality !== 'IND').length;
    if (overseas > MAX_OVERSEAS) err(`${nm} have ${overseas} overseas players — cap is ${MAX_OVERSEAS}.`, tid);
    const keepers = squad.filter(p => p.role === 4 || p.canKeep).length;
    if (keepers === 0) err(`${nm} have no wicket-keeper.`, tid);
    else if (keepers === 1) warn(`${nm} have only one wicket-keeper.`, tid);
    const bowlers = squad.filter(p => p.bowling >= 50).length;
    if (bowlers < 5) err(`${nm} have only ${bowlers} players who can bowl — need at least 5.`, tid);
    const js = new Set(); let jtrouble = false;
    for (const p of squad) { if (p.jersey < 1 || p.jersey > 99 || js.has(p.jersey)) jtrouble = true; js.add(p.jersey); }
    if (jtrouble) warn(`${nm} have duplicate or out-of-range jersey numbers.`, tid);
  }
  for (const code of CUP_NATIONS) {
    const n = roster.players.filter(p => p.nationality === code).length;
    if (n < 11) err(`${NATION_NAME[code]} have only ${n} players — a nation needs at least 11.`);
  }
  for (const i of issues) {

/* ---------- sort + filter ---------- */
function numMatch(v, expr) {
  expr = String(expr).trim(); if (!expr) return true;
  let m = expr.match(/^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)$/);
  if (m) return v >= parseFloat(m[1]) && v <= parseFloat(m[2]);
  m = expr.match(/^(>=|<=|>|<|=)?\s*(\d+(?:\.\d+)?)$/);
  if (!m) return true;
  const op = m[1] || '=', n = parseFloat(m[2]);
  switch (op) { case '>': return v > n; case '>=': return v >= n; case '<': return v < n;
    case '<=': return v <= n; default: return v === n; }
}
function passesFilters(p) {
  for (const col of COLS) {
    const f = colFilters[col.key];
    if (f == null || f === '') continue;
    if (col.kind === 'num') { if (!numMatch(col.sortVal(p), f)) return false; }
    else if (col.kind === 'cat') { if (String(col.catVal(p)) !== String(f)) return false; }
    else if (col.kind === 'bool') { const b = col.boolVal(p); if (f === 'yes' && !b) return false; if (f === 'no' && b) return false; }
    else if (col.kind === 'tags') { if (!p[col.key].includes(parseInt(f))) return false; }
    else if (col.kind === 'text') { if (!String(p[col.key]).toLowerCase().includes(String(f).toLowerCase())) return false; }
  }
  return true;
}
function activeColumns() {
  return Object.keys(colFilters).some(k => colFilters[k] !== '' && colFilters[k] != null) || sortKey;
}
function visiblePlayers() {
  let list = roster.players;
  if (filterTeam === 'FREE') list = list.filter(p => p.startingTeamId == null);
  else if (filterTeam !== 'ALL') list = list.filter(p => p.startingTeamId === filterTeam);
  if (searchText) { const q = searchText.toLowerCase(); list = list.filter(p => p.name.toLowerCase().includes(q)); }
  list = list.filter(passesFilters);
  const col = sortKey ? COLS.find(c => c.key === sortKey) : null;
  if (col && sortDir) {
    list = list.slice().sort((a, b) => {
      const va = col.sortVal(a), vb = col.sortVal(b);
      let c = (typeof va === 'string') ? va.localeCompare(vb) : (va - vb);
      return c * sortDir;
    });
  } else {
    list = list.slice().sort((a, b) => {
      const ta = a.startingTeamId || 'zzz', tb = b.startingTeamId || 'zzz';
      if (ta !== tb) return ta < tb ? -1 : 1;
      return (b.batting + b.bowling) - (a.batting + a.bowling);
    });
  }
  return list;
}

    for (const [key, label, fmt] of PLAYER_FIELDS) {
      const ov = b[key], nv = p[key];
      if (ov !== nv) fields.push({ label, old: fmt(ov), new: fmt(nv) });
    }
    for (const [key, label, labels] of TAG_FIELDS) {
      const os = tagSetStr(b[key], labels), ns = tagSetStr(p[key], labels);
      if (os !== ns) fields.push({ label, old: os, new: ns });
    }
    if (fields.length) modified.push({ p, b, fields });
  }
  for (const p of baseline.players) if (!curById[p.id]) removed.push(p);
  // team branding diffs
  const teamDiffs = [];
  for (const t of roster.teams) {
    const bt = baseline.teams.find(x => x.id === t.id); if (!bt) continue;
    const fields = [];
    for (const [k, l] of [['name','Name'],['nickname','Nickname'],['shortName','Short code'],['icon','Icon']])
      if (t[k] !== bt[k]) fields.push({ label: l, old: bt[k], new: t[k] });
    for (const [k, l] of [['primaryColor','Primary colour'],['secondaryColor','Secondary colour']])
      if ((t[k]>>>0) !== (bt[k]>>>0)) fields.push({ label: l, old: '#'+((bt[k]>>>0)&0xFFFFFF).toString(16).padStart(6,'0'), new: '#'+((t[k]>>>0)&0xFFFFFF).toString(16).padStart(6,'0') });
    if (fields.length) teamDiffs.push({ t, fields });
  }
  return { modified, added, removed, teamDiffs };
}
function openDiff() {
  const d = computeDiff();
  const body = el('div');
  body.appendChild(el('div', { className: 'note', style: 'margin-bottom:12px',
    textContent: 'Everything this roster changes versus the default the game ships with. Use it to review exactly what would change if this roster became the new default.' }));
  const sum = el('div', { className: 'diff-summary' });
  const stat = (n, label, color) => {
    const s = el('div', { className: 'diff-stat' });
    s.appendChild(el('b', { textContent: n, style: color ? `color:${color}` : '' }));
    s.appendChild(el('span', { textContent: label }));
    sum.appendChild(s);
  };
  stat(d.modified.length, 'players edited', '#e3b341');
  stat(d.added.length, 'players added', '#56d364');
  stat(d.removed.length, 'players removed', '#ff7b72');
  stat(d.teamDiffs.length, 'teams rebranded', '#4f9dff');
  body.appendChild(sum);

  if (!d.modified.length && !d.added.length && !d.removed.length && !d.teamDiffs.length) {
    body.appendChild(el('div', { className: 'diff-none', textContent: 'No changes — this roster is identical to the default.' }));
  }
  const section = (title, nodes) => {
    if (!nodes.length) return;
    const sec = el('div', { className: 'diff-sec' });
    sec.appendChild(el('h3', { textContent: `${title} (${nodes.length})` }));
    nodes.forEach(n => sec.appendChild(n)); body.appendChild(sec);
  };
  const where = p => p.startingTeamId == null ? 'Free agent' : teamLabel(p.startingTeamId);

  section('Players edited', d.modified.map(({ p, fields }) => {
    const box = el('div', { className: 'diff-player' });
    const h = el('div', { className: 'ph' });
    h.appendChild(el('span', { textContent: p.name }));
    h.appendChild(el('span', { className: 'where', textContent: where(p) }));
    box.appendChild(h);
    for (const f of fields) {
      const row = el('div', { className: 'diff-field' });
      row.innerHTML = `<span class="fk">${f.label}</span><span class="old">${escapeHtml(String(f.old))}</span><span class="arrowc">→</span><span class="new">${escapeHtml(String(f.new))}</span>`;
      box.appendChild(row);
    }
    return box;
  }));
  section('Players added', d.added.map(p => {
    const box = el('div', { className: 'diff-player' });
    const h = el('div', { className: 'ph' });
    h.appendChild(el('span', { className: 'badge-add', textContent: 'NEW' }));
    h.appendChild(el('span', { textContent: p.name }));
    h.appendChild(el('span', { className: 'where', textContent: `${where(p)} · ${ROLES[p.role]} · ${NATION_NAME[p.nationality]||p.nationality} · BAT ${p.batting} / BOWL ${p.bowling}` }));
    box.appendChild(h); return box;
  }));
  section('Players removed', d.removed.map(p => {
    const box = el('div', { className: 'diff-player' });
    const h = el('div', { className: 'ph' });
    h.appendChild(el('span', { className: 'badge-del', textContent: 'REMOVED' }));
    h.appendChild(el('span', { textContent: p.name }));
    h.appendChild(el('span', { className: 'where', textContent: `${p.startingTeamId == null ? 'Free agent' : teamLabel(p.startingTeamId)} · ${ROLES[p.role]} · ${NATION_NAME[p.nationality]||p.nationality}` }));
    box.appendChild(h); return box;
  }));
  section('Teams rebranded', d.teamDiffs.map(({ t, fields }) => {
    const box = el('div', { className: 'diff-player' });
    box.appendChild(el('div', { className: 'ph', textContent: `${t.shortName} — ${t.name}` }));
    for (const f of fields) {
      const row = el('div', { className: 'diff-field' });
      row.innerHTML = `<span class="fk">${f.label}</span><span class="old">${escapeHtml(String(f.old))}</span><span class="arrowc">→</span><span class="new">${escapeHtml(String(f.new))}</span>`;
      box.appendChild(row);
    }
    return box;
  }));

  const close = el('button', { className: 'primary', textContent: 'Close' }); close.addEventListener('click', closeModal);
  modal('Changes vs default roster', body, [close], true);
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

/* ---------- add player ---------- */
function addPlayer() {
  let nextId = CUSTOM_ID_BASE;
  for (const p of roster.players) if (p.id >= nextId) nextId = p.id + 1;
  const team = (filterTeam === 'ALL' || filterTeam === 'FREE') ? null : filterTeam;
  const p = parsePlayer({
    id: nextId, name: 'New Player', jersey: 1, role: 1, bowlerType: 0, handedness: 0,
    nationality: 'IND', startingTeamId: team, weaknesses: [], strengths: [], shotWeaknesses: [],
    evolving: { age: 24, batting: 50, power: 50, technique: 50, temperament: 50, aggression: 50,
      style: 50, running: 50, vsPace: 50, vsSpin: 50, bowling: 30, pace: 50, control: 50,
      variation: 50, death: 50, composure: 50, catching: 50, fielding: 50, form: 60, morale: 7, staminaPct: 100 },
  });
  roster.players.push(p);
  searchText = ''; $('#search').value = '';
  renderRows(); validate();
  toast(`Added player (id ${p.id})`);
}

/* ---------- file I/O ---------- */
function loadRoster(json) {
  roster = parsePreset(json);
  teamOrder = roster.teams.map(t => t.id);
  teamIndex = {}; for (const t of roster.teams) teamIndex[t.id] = t;
  filterTeam = 'ALL'; sortKey = null; sortDir = 0; colFilters = {};
  buildColumns(); buildHead(); renderChips(); renderRows(); validate(); updateClearBtn();
}
function doExport() {
  const json = rosterToJson();
  const blob = new Blob([JSON.stringify(json)], { type: 'application/json' });
  const slug = (json.name || 'roster').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '') || 'roster';
  const a = el('a', { href: URL.createObjectURL(blob), download: `criccoach-roster-${slug}.json` });
  document.body.appendChild(a); a.click(); a.remove();
  const errs = issues.filter(i => i.sev === 'err').length;
  toast(errs ? `Exported — but ${errs} error(s) remain; fix them or the app will reject it.` : 'Exported. Send this file back!');
}
function importFile(file) {
  const fr = new FileReader();
  fr.onload = () => { try { loadRoster(JSON.parse(fr.result)); toast('Roster loaded.'); }
    catch (e) { alert('Could not load that file:\n' + e.message); } };
  fr.readAsText(file);
}

/* ---------- wiring ---------- */
$('#btnImport').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; });
$('#btnExport').addEventListener('click', doExport);
$('#btnDiff').addEventListener('click', () => { if (!roster || !baseline) return; openDiff(); });
$('#btnAdd').addEventListener('click', addPlayer);
$('#btnDefault').addEventListener('click', () => {
  if (roster && !confirm('Discard current edits and reload the default roster?')) return;
  loadDefault();
});
$('#btnFilters').addEventListener('click', () => {
  filtersOn = !filtersOn;
  $('#btnFilters').classList.toggle('on', filtersOn);
  $('#thead').classList.toggle('nofilter', !filtersOn);
  requestAnimationFrame(positionSticky);
});
$('#btnClear').addEventListener('click', () => {
  colFilters = {}; sortKey = null; sortDir = 0;
  buildHead(); renderRows(); updateClearBtn();
});
$('#search').addEventListener('input', e => { searchText = e.target.value.trim(); renderRows(); });
$('#valbar').addEventListener('click', () => {
  const l = $('#vallist'); l.classList.toggle('hidden');
  if (!l.classList.contains('hidden')) renderValList();
});
window.addEventListener('beforeunload', e => { if (roster) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', positionSticky);

function loadDefault() {
  fetch('default_roster.json')
    .then(r => { if (!r.ok) throw new Error('default_roster.json not found'); return r.json(); })
    .then(j => { baseline = parsePreset(j); loadRoster(j); })
    .catch(e => {
      $('#emptyState').querySelector('.big').textContent = 'Could not load the default roster.';
      $('#emptyState').querySelector('.note').textContent = e.message + ' — use “Import roster…” to open a file instead.';
    });
}
loadDefault();
</script>
